 intro:{speaker:'Narration',text:'The academy studios were supposed to be empty by nine. At 9:17, rain tapped the tall windows, a kettle hummed in the corner, and three familiar silhouettes were still here.',next:'intro2',chapter:'The last open studio',loc:'✧ &nbsp; A Moonlit Atelier'},
 intro2:{speaker:'Narration',text:'“We should do something with our last night,” someone said. The words settled between the unfinished canvases like a promise. “Something we’ll remember.”',next:'meet',chapter:'The last open studio'},
 meet:{speaker:'Narration',text:'Hana rinsed a paintbrush. Yui closed the piano lid. Rei looked up from her notebook. Each of them glanced your way, waiting to see where you’d sit.',choices:[{text:'Join Hana by the window and ask about her painting.',to:'hana1',c:'Hana',heart:1},{text:'Sit beside Yui at the old piano.',to:'yui1',c:'Yui',heart:1},{text:'Ask Rei what she’s writing beneath the stars.',to:'rei1',c:'Rei',heart:1}],chapter:'Three unfinished things'},
 hana1:{speaker:'Hana',text:'“It’s the view from this room, I think.” Hana turned the canvas a little. Loose strokes of blue and gold, a window left deliberately blank. “I can’t decide what belongs outside it.”',next:'hana2',chapter:'A color left waiting',loc:'✧ &nbsp; The east window',c:'Hana'},
 hana2:{speaker:'You',text:'She handed you a brush, still warm from her fingers. “Choose a color for the sky?” Her smile was small, but she held your gaze.',choices:[{text:'“The color of the sky right before it rains.”',to:'hana3a',heart:1},{text:'“Gold. You always paint the things you’re afraid to lose.”',to:'hana3b',heart:1}],chapter:'A color left waiting',c:'Hana'},
 hana3a:{speaker:'Hana',text:'“Storm-blue,” she murmured, laying the color down. “You noticed.” The two of you painted in comfortable quiet until the rain began to fade.',next:'hana4',chapter:'A color left waiting',c:'Hana'},
 hana3b:{speaker:'Hana',text:'Her brush paused. Then she laughed, a soft sound that turned into a smile. “That’s a little unfair. You see too much.” She painted the window gold anyway.',next:'hana4',chapter:'A color left waiting',c:'Hana'},
 hana4:{speaker:'Hana',text:'When the sky cleared, she stood beside you at the glass. “I used to think finishing a picture meant getting it right.” A beat. “Maybe it just means letting someone else see it.”',choices:[{text:'“Then let me see all of it. Even the unfinished parts.”',to:'hanaEnd',heart:1},{text:'“Next time, let’s paint somewhere neither of us knows.”',to:'hanaEnd',heart:1}],chapter:'A color left waiting',c:'Hana'},
 hanaEnd:{speaker:'Hana',text:'She turned the canvas toward you: two figures beneath a rain-washed sky, their shoulders almost touching. “I think,” she said, reaching for your hand, “I’d like there to be a next time.” Outside, the clouds opened to a thin ribbon of dawn.',ending:'Hana · The sky after rain',chapter:'The sky after rain',c:'Hana'},
 yui1:{speaker:'Yui',text:'Yui tapped a rhythm on the piano lid. “I was trying to write something for graduation. Everything I play sounds like a goodbye.” She slid over on the bench. “Want to help?”',next:'yui2',chapter:'A melody for tomorrow',loc:'✧ &nbsp; The music room',c:'Yui'},
 yui2:{speaker:'You',text:'“What if it didn’t have to be a goodbye?” You hummed a few notes. Yui listened, then picked them up on the keys—turning your uncertain melody into something warm.',choices:[{text:'Stay close and find the next notes together.',to:'yui3a',heart:1},{text:'Ask her to teach you the chords, slowly.',to:'yui3b',heart:1}],chapter:'A melody for tomorrow',c:'Yui'},
 yui3a:{speaker:'Yui',text:'“That one,” she said, looking at you instead of the keys. “Let’s keep that.” The music grew gentler, a tune with room for a beginning.',next:'yui4',chapter:'A melody for tomorrow',c:'Yui'},
 yui3b:{speaker:'Yui',text:'She placed your fingers on the keys, one by one. “There. You’ve got it.” Her hands lingered over yours as the chord softened into silence.',next:'yui4',chapter:'A melody for tomorrow',c:'Yui'},
 yui4:{speaker:'Yui',text:'The last note drifted through the empty hall. “I thought I needed to write a perfect ending.” She rested her shoulder against yours. “Maybe I just needed a reason to keep playing.”',choices:[{text:'“I’d listen to every song you haven’t written yet.”',to:'yuiEnd',heart:1},{text:'“Let’s make this our first song, not your last.”',to:'yuiEnd',heart:1}],chapter:'A melody for tomorrow',c:'Yui'},
 yuiEnd:{speaker:'Yui',text:'“Then stay for one more?” she asked, hand finding yours on the piano bench. Together you played the melody again—less like a farewell now, more like a door opening. The first train rumbled awake beyond the windows.',ending:'Yui · A song still playing',chapter:'A song still playing',c:'Yui'},
 rei1:{speaker:'Rei',text:'Rei closed the notebook halfway. “A poem about this room, before it changes.” She traced the silver edge of a star on the page. “But I’ve run out of honest endings.”',next:'rei2',chapter:'The space between stars',loc:'✧ &nbsp; The rooftop',c:'Rei'},
 rei2:{speaker:'You',text:'You climbed the stairs to the rooftop together. City lights shimmered below. Rei held out her notebook. “Tell me what you’ll remember about tonight.”',choices:[{text:'“The way this place feels when you’re here.”',to:'rei3a',heart:1},{text:'“That we didn’t have to say goodbye just yet.”',to:'rei3b',heart:1}],chapter:'The space between stars',c:'Rei'},
 rei3a:{speaker:'Rei',text:'She wrote it down, then circled the words. “I was hoping you’d say something like that.” The wind caught a strand of her hair; she tucked it behind her ear.',next:'rei4',chapter:'The space between stars',c:'Rei'},
 rei3b:{speaker:'Rei',text:'“Not goodbye,” she repeated, testing the sound of it. She added a new line beneath the poem. This time, she didn’t cross anything out.',next:'rei4',chapter:'The space between stars',c:'Rei'},

let current='title',route='',affinity={Hana:0,Yui:0,Rei:0},log=[],auto=false;
const $=id=>document.getElementById(id);function escapeHTML(s){return s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function render(){const n=story[current];if(!n)return;if(n.c){$('portrait').classList.add('out');setTimeout(()=>{$('portrait').innerHTML=portraitSVG(n.c);$('portrait').classList.remove('out')},140);$('nameTag').classList.add('show');$('charName').firstChild.textContent=n.c;$('charRole').textContent=characters[n.c].role}else{$('portrait').innerHTML='';$('nameTag').classList.remove('show')}
$('intro').hidden=true;$('dialogueWrap').hidden=false;$('chapterLabel').textContent=n.chapter||'The last open studio';if(n.loc)$('locationLabel').innerHTML=n.loc;$('speaker').textContent=n.speaker;$('speaker').className='speaker'+(n.speaker==='Narration'?' narrator':'');$('dialogue').textContent=n.text;$('continueBtn').hidden=!!n.choices||!!n.ending;$('choices').hidden=!n.choices;$('choices').innerHTML=n.choices?n.choices.map((x,i)=>`<button class="choice" data-choice="${i}">${escapeHTML(x.text)}</button>`).join(''):'';
log.push({speaker:n.speaker,text:n.text});if(n.ending)setTimeout(()=>endingModal(n.ending),650);$('heartLabel').textContent='♥'.repeat(Math.min(3,affinity[route]||0))+'♡'.repeat(3-Math.min(3,affinity[route]||0));}
function advance(){const n=story[current];if(n?.next){current=n.next;render()}}
function choose(i){const n=story[current],choice=n.choices[i];if(choice.c){route=choice.c}if(choice.heart&&route)affinity[route]=(affinity[route]||0)+1;current=choice.to;render()}
$('startBtn').onclick=()=>{current='intro';render()};$('continueBtn').onclick=advance;$('choices').onclick=e=>{const b=e.target.closest('[data-choice]');if(b)choose(+b.dataset.choice)};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key===' '&&current!=='title'&&!$('overlay').classList.contains('open'))advance()});
function save(){localStorage.setItem('afterglow-save',JSON.stringify({current,route,affinity,log}));showToast('Saved to this device')};$('saveBtn').onclick=save;
function closeModal(){$('overlay').classList.remove('open')};$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('logBtn').onclick=()=>{$('modal').innerHTML=`<div class="eyebrow">Your evening so far</div><h2>Story log</h2><div class="log-lines">${log.length?log.slice(-16).map(x=>`<p><b>${escapeHTML(x.speaker)}</b><br>${escapeHTML(x.text)}</p>`).join(''):'<p>Your story will appear here as you play.</p>'}</div><div class="modal-actions"><button class="modal-btn primary" onclick="closeModal()">Back to story</button></div>`;$('overlay').classList.add('open')};
function endingModal(title){$('modal').innerHTML=`<div class="ending-card"><div class="end-icon">✧</div><div class="eyebrow">One evening · One beginning</div><h2>${escapeHTML(title)}</h2><p>You found a little more time, and something worth carrying into tomorrow.</p><p class="save-status">Progress saved automatically on this device.</p><div class="modal-actions" style="justify-content:center"><button class="modal-btn primary" onclick="newGame()">Play another route</button><button class="modal-btn" onclick="closeModal()">Stay a little longer</button></div></div>`;$('overlay').classList.add('open');save()}
window.closeModal=closeModal;window.newGame=()=>{closeModal();current='title';route='';affinity={Hana:0,Yui:0,Rei:0};log=[];$('dialogueWrap').hidden=true;$('intro').hidden=false;$('portrait').innerHTML='';$('nameTag').classList.remove('show');$('chapterLabel').textContent='A story in soft light';$('locationLabel').innerHTML='✧ &nbsp; A Moonlit Atelier';localStorage.removeItem('afterglow-save')};$('restartBtn').onclick=()=>{if(confirm('Start a new evening? Your current story will be reset.'))newGame()};
$('stage').addEventListener('click',e=>{if(current==='title')return;if(e.target.closest('.choice')||e.target.closest('button'))return;if(!$('overlay').classList.contains('open')&&!story[current]?.choices&&!story[current]?.ending)advance()});
const saved=localStorage.getItem('afterglow-save');if(saved){try{const s=JSON.parse(saved);if(story[s.current]&&s.current!=='title'){current=s.current;route=s.route||'';affinity=s.affinity||affinity;log=s.log||[];render()}}catch{}}
</script>
